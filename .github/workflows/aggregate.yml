name: aggregate

# The official-registry aggregate flow (spec 37 §6): rebuild
# tpkg-registry.yaml from the feedstocks' own registries and commit any
# drift; assert parity on every push/PR so a hand-edit goes red.
#
# Pull model: the schedule catches everything, self-healing; feedstocks
# MAY fire a repository_dispatch after publishing for immediacy (the
# regeneration is identical either way).

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [feedstock-published]
  push:
    branches: [main]
    paths: [tools/**, feedstocks.txt, .github/workflows/aggregate.yml]
  pull_request:
    paths: [tools/**, feedstocks.txt, .github/workflows/aggregate.yml, tpkg-registry.yaml]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # Scheduled runs and dispatches regenerate + commit; pushes/PRs to
    # the tooling only validate parity (below) without committing.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Regenerate the aggregate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ruby tools/aggregate.rb
      # Land the drift by PR, never by push: main is branch-protected
      # and the direct push is refused with GH006 (failing since
      # 2026-11-18 — run 44479935194). The feedstock's registry bot PR
      # pattern: the org PAT authors the PR (its checks run like on any
      # human PR), auto-merge rides the parity gate. A clean tree is a
      # no-op (create-pull-request exits clean).
      - name: Open the drift pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.TEBAKO_CI_PAT_TOKEN }}
          branch: aggregate/drift
          add-paths: tpkg-registry.yaml
          title: "aggregate: regenerate from the feedstocks"
          commit-message: "aggregate: regenerate from the feedstocks"
          body: |
            Automated aggregate regeneration (the drift from the feedstocks' published rows). Auto-merges when the parity check goes green — the committed file must equal a fresh regeneration.

      - name: Auto-merge the drift PR
        env:
          GH_TOKEN: ${{ secrets.TEBAKO_CI_PAT_TOKEN }}
        run: |
          # --auto rides the parity gate; the direct fallback covers
          # repos where auto-merge is disabled (the feedstock's bot PR
          # convention). A no-drift run never reaches here (the step
          # above no-ops on a clean tree).
          gh pr merge --auto --squash aggregate/drift || gh pr merge --squash aggregate/drift || true

  parity:
    runs-on: ubuntu-latest
    # Every push and PR: the committed file must equal a fresh
    # regeneration — hand-edits and stale rows both go red.
    # NOT on schedule/dispatch: there the regenerate job is the actor
    # (it commits the drift itself), and a concurrent parity read of the
    # pre-commit state is a guaranteed-red race whenever drift exists —
    # the 2026-09-30 dispatch (run 36653094809) went red on exactly that
    # while regenerate landed the drift in the same run.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Parity check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ruby tools/aggregate.rb --check
